services:
  db:
    image: postgres:18-alpine
    container_name: shdewz-chan-db
    restart: unless-stopped
    env_file: [.env.local]
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      start_period: 10s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: shdewz-chan
    restart: unless-stopped
    env_file: [.env.local]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: ["sh", "-c", "bun run migrate && bun src/index.ts"]

volumes:
  db_data:
