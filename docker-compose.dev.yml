services:
  db:
    image: postgres:18-alpine
    container_name: shdewz-chan-db-dev
    env_file: [.env.development.local]
    volumes:
      - db_data-dev:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      start_period: 10s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: shdewz-chan:dev
    container_name: shdewz-chan-dev
    working_dir: /app
    env_file: [.env.development.local]
    environment:
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "bun run migrate && bun --watch src/index.ts"]

volumes:
  db_data-dev:
